<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifying Account | Texas Home Hub Pro</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="assets/css/auth.css"></head><body class="auth-page"><main class="auth-form-panel" style="min-height:100vh"><div class="auth-card"><h2>Verifying your account</h2><p id="callbackStatus">Please wait while we securely complete your sign-in.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/property-engagement.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const client=window.THHPropertyEngagement?.getClient?.();const status=document.getElementById('callbackStatus');if(!client){status.textContent='Supabase is not configured yet.';return}const{data,error}=await client.auth.getSession();if(error){status.textContent=error.message;return}if(data.session){status.textContent='Verification complete. Redirecting to your dashboard...';setTimeout(()=>location.href='dashboard.html',600)}else{status.textContent='Your email may be verified. Sign in to continue.';setTimeout(()=>location.href='login.html',1000)}});</script></body></html>
