<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Texas Home Hub Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>.not-found{min-height:100vh;display:grid;place-items:center;padding:2rem;background:var(--cream)}.not-found-card{max-width:680px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:clamp(2rem,6vw,4.5rem);box-shadow:var(--shadow)}.not-found h1{font-family:'Playfair Display',serif;color:var(--navy);font-size:clamp(3rem,8vw,6rem);margin:0}.not-found p{color:var(--muted);margin:1rem auto 2rem}</style>
</head>
<body>
  <main class="not-found"><section class="not-found-card"><p class="eyebrow">404 error</p><h1>That page moved.</h1><p>The address may be outdated, or the property page may no longer be available.</p><a class="btn btn-primary" href="index.html">Return Home</a> <a class="btn btn-dark" href="listings.html">Search Homes</a></section></main>
</body>
</html>
