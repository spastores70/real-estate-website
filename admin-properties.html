<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property Management | Texas Home Hub Pro</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="assets/css/admin-properties.css"></head><body><div id="propertyAdminGate" class="admin-gate"><h1>Loading Property Management…</h1></div><main id="propertyAdminApp" hidden><header class="pm-topbar"><div><p class="eyebrow">Texas Home Hub Pro</p><h1>Property Management</h1></div><div class="pm-actions"><a class="btn" href="admin-crm.html">CRM</a><a class="btn" href="listings.html" target="_blank">Public Listings</a><button class="btn btn-primary" id="newPropertyButton">+ Add Property</button></div></header><section class="pm-metrics"><article><strong id="totalProperties">0</strong><span>Total</span></article><article><strong id="activeProperties">0</strong><span>Active</span></article><article><strong id="draftProperties">0</strong><span>Draft</span></article><article><strong id="featuredProperties">0</strong><span>Featured</span></article></section><section class="pm-panel"><div class="pm-toolbar"><input id="propertySearch" type="search" placeholder="Search address, city, ZIP, or title"><select id="propertyStatusFilter"><option value="">All statuses</option><option>draft</option><option>active</option><option>pending</option><option>sold</option><option>archived</option></select><select id="propertyCategoryFilter"><option value="">All categories</option><option>Residential</option><option>Commercial</option><option>Land</option><option>Multi-family</option><option>Luxury</option></select></div><div class="pm-table-wrap"><table><thead><tr><th>Property</th><th>Price</th><th>Status</th><th>Visibility</th><th>Actions</th></tr></thead><tbody id="propertyTableBody"></tbody></table></div><div id="propertyEmpty" class="pm-empty" hidden>No properties match the selected filters.</div></section></main><dialog id="propertyDialog"><form method="dialog" id="propertyForm"><div class="dialog-header"><div><p class="eyebrow">Property editor</p><h2 id="propertyDialogTitle">Add Property</h2></div><button type="button" id="closePropertyDialog" aria-label="Close">×</button></div><input type="hidden" name="id"><div class="form-grid"><label class="span-2">Listing title<input name="title" required></label><label class="span-2">Street address<input name="address"></label><label>City<input name="city" required></label><label>ZIP<input name="zip" required></label><label>County<input name="county"></label><label>Price<input name="price" type="number" min="0" step="1000" required></label><label>Bedrooms<input name="beds" type="number" min="0" step="0.5"></label><label>Bathrooms<input name="baths" type="number" min="0" step="0.5"></label><label>Square feet<input name="sqft" type="number" min="0"></label><label>Year built<input name="year_built" type="number" min="1800"></label><label>Property type<select name="property_type"><option>Single Family</option><option>Condo</option><option>Townhome</option><option>Multi-family</option><option>Commercial</option><option>Land</option></select></label><label>Category<select name="category"><option>Residential</option><option>Commercial</option><option>Land</option><option>Multi-family</option><option>Luxury</option></select></label><label>Status<select name="status"><option>draft</option><option>active</option><option>pending</option><option>sold</option><option>archived</option></select></label><label>Badge<select name="badge"><option value="">None</option><option>Featured</option><option>New</option><option>Open House</option><option>Pending</option><option>Sold</option></select></label><label class="span-2">Description<textarea name="description" rows="5"></textarea></label><label class="span-2">Features, one per line<textarea name="features" rows="4"></textarea></label><label class="check"><input name="featured" type="checkbox"> Featured property</label><label class="check"><input name="published" type="checkbox"> Publish publicly</label><label class="span-2">Upload photos<input id="propertyImages" type="file" accept="image/*" multiple></label><div class="span-2 image-manager" id="imageManager"></div></div><p id="propertyFormStatus" class="form-status"></p><div class="dialog-actions"><button type="button" class="btn" id="cancelProperty">Cancel</button><button type="submit" class="btn btn-primary" id="saveProperty">Save Property</button></div></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/property-engagement.js"></script><script src="assets/js/property-repository.js"></script><script src="assets/js/admin-properties.js"></script></body></html>
